# CaseForge engine settings. Paths are POSIX-style and relative to this file.
# Override any value with CASEFORGE__SECTION__KEY=value (for example CASEFORGE__RUN__SEED=7).
# Secrets never belong in this file.
settings_version: 1
run:
  seed: 20261015
  tenant_id: tenant-demo
vocabulary:
  canonical: vocabulary/canonical.v1.yaml
  mappings:
    - vocabulary/mappings/sim.v1.yaml
provenance:
  snapshot_mode: redacted   # full | redacted | off
storage:
  records_path: ../data/records.db
  checkpoints_path: ../data/checkpoints.db
simulation:
  families_dir: simulation/families
  start_at: "2026-01-05T09:00:00Z"
  investigate_after_minutes: 1560
triage:
  default_action: escalate_case
  rules:
    - id: stalled-task-reminder
      when_all: [task.delayed]
      unless_any: [policy.exception]
      action: send_reminder
    - id: outstanding-document-reminder
      when_all: [document.requested]
      unless_any: [document.received]
      action: send_reminder
tools:
  get_case: {allowed_agents: [supervisor, evidence]}
  get_timeline: {allowed_agents: [evidence], max_results: 50}
  search_policies: {allowed_agents: [policy], max_results: 5}
  search_prior_episodes: {allowed_agents: [evidence], max_results: 5}
