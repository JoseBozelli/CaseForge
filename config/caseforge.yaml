# CaseForge engine settings. Paths are POSIX-style and relative to this file.
# Override any value with CASEFORGE__SECTION__KEY=value (for example CASEFORGE__RUN__SEED=7).
# Secrets never belong in this file.
settings_version: 1
run:
  seed: 20261015
  tenant_id: tenant-demo
vocabulary:
  canonical: vocabulary/canonical.v1.yaml
  mappings:
    - vocabulary/mappings/sim.v1.yaml
provenance:
  snapshot_mode: redacted   # full | redacted | off
  snapshot_dir: ../data/snapshots
storage:
  records_path: ../data/records.db
  checkpoints_path: ../data/checkpoints.db
simulation:
  families_dir: simulation/families
  store_path: ../data/simulation.db
  start_at: "2026-01-05T09:00:00Z"
  investigate_after_minutes: 1560
triage:
  default_action: escalate_case
  rules:
    - id: stalled-task-reminder
      when_all: [task.delayed]
      unless_any: [policy.exception]
      action: send_reminder
    - id: outstanding-document-reminder
      when_all: [document.requested]
      unless_any: [document.received]
      action: send_reminder
tools:
  get_case: {allowed_agents: [supervisor, evidence, single]}
  get_timeline: {allowed_agents: [evidence, single], max_results: 50}
  search_policies: {allowed_agents: [policy, single], max_results: 5}
  search_prior_episodes: {allowed_agents: [evidence, single], max_results: 5}
knowledge:
  corpus_dir: knowledge/policies
  k1: 1.5
  b: 0.75
  min_score: 1.0
reasoning:
  provider: fake            # fake (scripted) | replay (cassette) | anthropic (Claude API)
  source: live              # anthropic only: live (records to the cassette) | replay (cassette, $0)
  model: fake-model
  params: {temperature: 0, max_tokens: 2048, output_mode: json_schema}
  prompts_dir: prompts
  cassette_path: ../data/cassettes/default.jsonl
  api_key_file: ../.secrets/anthropic_api_key
  timeout_seconds: 60
  pricing:                  # fallback USD per million tokens when the model is not in price_table
    input_usd_per_million: 0.0
    output_usd_per_million: 0.0
  price_table:              # verified 2026-10-19 at platform.claude.com/docs/en/about-claude/pricing
    claude-sonnet-5-5: {input_usd_per_million: 2.0, output_usd_per_million: 10.0}
    claude-haiku-5-5: {input_usd_per_million: 0.10, output_usd_per_million: 0.50}
agents:
  supervisor:
    plan_version: 1
    synthesis_version: 1
    max_clarification_rounds: 1
    allowed_actions: [send_reminder, request_document, reassign_task, escalate_case, grant_policy_exception]
  evidence: {prompt_version: 1, max_steps: 4}
  policy: {prompt_version: 1, max_steps: 3}
  single: {prompt_version: 1, max_steps: 6}
engine:
  mode: hierarchical        # deterministic (rules only) | hierarchical (rule fast path, then agents) | single_agent
  escalation_action: escalate_case
  approval_required: [grant_policy_exception]
memory:
  k1: 1.5
  b: 0.75
  min_score: 0.5
governance:
  store_path: ../data/governance.db
  roles:
    viewer: []
    approver: [approve_action]
    admin: [approve_action, emergency_stop, manage_breakers, reconcile_action]
  operators:
    viewer-1: [viewer]
    approver-1: [approver]
    admin-1: [admin]
  budgets:
    max_llm_calls: 20
    max_total_tokens: 60000
    max_cost_usd: 0.25
    max_tool_calls: 30
  breakers:
    failure_threshold: 3
    cooldown_seconds: 300
  retries:
    max_attempts: 3
    backoff_seconds: 0.5
evaluation:
  benchmark_path: evaluation/benchmark.v1.yaml
  results_dir: ../eval_results
  workspace_dir: ../data/evaluation
  outcome_wait_minutes: 7200      # simulated time allowed for outcomes before scoring
  approver: approver-1
  admin: admin-1
  failing_tools: [get_timeline, search_policies]
