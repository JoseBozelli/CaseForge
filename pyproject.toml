[project]
name = "caseforge"
version = "0.1.0"
description = "Stateful, governed, multi-agent workflow engine for operational case resolution."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph>=1.2.15,<2",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
markers = ["live: requires a paid model API and network access"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
